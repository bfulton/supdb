-width="2"/><path d="M78.0 298.0L628.0 94.0" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/><text x="637.0" y="97.8" class="lbl" fill="var(--fg3)">linear</text><text x="637.0" y="285.1" class="lbl" fill="var(--s1)">measured</text><line x1="78.0" y1="392.0" x2="94.0" y2="392.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="395.8" class="lg">measured</text><line x1="160.8" y1="392.0" x2="176.8" y2="392.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="182.8" y="395.8" class="lg">linear</text><text x="78" y="422.0" class="cap">Median of interleaved repetitions; band is the 95% bootstrap interval of the median. A shared</text><text x="78" y="436.0" class="cap">mmap-able index would be a flat line. Every read benchmark in the design document calls</text><text x="78" y="450.0" class="cap">Reader::open before starting its timer, so this cost appears nowhere.</text></svg>