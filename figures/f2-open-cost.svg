<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Reader open cost scales with key count"><style>:root{--fg:#151a24;--fg2:#525d74;--fg3:#7d879c;--grid:#e2e6ee;--axis:#aeb6c6;--bg:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#4a3aa7;}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}}:root[data-theme="dark"]{--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}.ttl{font-size:15px;font-weight:600;fill:var(--fg)}.sub{font-size:11.5px;fill:var(--fg2)}.ax{font-size:11px;fill:var(--fg2);font-variant-numeric:tabular-nums}.axt{font-size:11.5px;font-weight:500;fill:var(--fg2)}.lbl{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.cap{font-size:10.5px;fill:var(--fg3)}.lg{font-size:11px;fill:var(--fg2)}</style><rect width="760" height="460" fill="var(--bg)"/><text x="78" y="26" class="ttl">Reader open cost scales with key count</text><text x="78" y="43" class="sub">Reader::build materialises the whole key index per process</text><line x1="78" y1="301.2" x2="628.0" y2="301.2" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="305.0" class="ax" text-anchor="end">0.50</text><line x1="78" y1="257.0" x2="628.0" y2="257.0" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="260.8" class="ax" text-anchor="end">1</text><line x1="78" y1="212.7" x2="628.0" y2="212.7" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="216.5" class="ax" text-anchor="end">2</text><line x1="78" y1="154.2" x2="628.0" y2="154.2" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="158.0" class="ax" text-anchor="end">5</text><line x1="78" y1="109.9" x2="628.0" y2="109.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="113.7" class="ax" text-anchor="end">10</text><line x1="78" y1="65.7" x2="628.0" y2="65.7" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="69.5" class="ax" text-anchor="end">20</text><line x1="78.0" y1="62" x2="78.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="78.0" y="348.0" class="ax" text-anchor="middle">10k</text><line x1="205.3" y1="62" x2="205.3" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="205.3" y="348.0" class="ax" text-anchor="middle">20k</text><line x1="373.5" y1="62" x2="373.5" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="373.5" y="348.0" class="ax" text-anchor="middle">50k</text><line x1="500.7" y1="62" x2="500.7" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="500.7" y="348.0" class="ax" text-anchor="middle">100k</text><line x1="628.0" y1="62" x2="628.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="628.0" y="348.0" class="ax" text-anchor="middle">200k</text><line x1="78" y1="330.0" x2="628.0" y2="330.0" stroke="var(--axis)" stroke-width="1"/><text x="353.0" y="370.0" class="axt" text-anchor="middle">keys in the store (log)</text><text transform="translate(18.0,196.0) rotate(-90)" class="axt" text-anchor="middle">open (ms) (log)</text><path d="M78.0 295.2L373.5 180.5L628.0 92.0L628.0 97.2L373.5 188.3L78.0 300.0Z" fill="var(--s1)" opacity="0.14"/><line x1="78.0" y1="300.0" x2="78.0" y2="295.2" stroke="var(--s1)" stroke-width="1.25" opacity="0.6"/><line x1="373.5" y1="188.3" x2="373.5" y2="180.5" stroke="var(--s1)" stroke-width="1.25" opacity="0.6"/><line x1="628.0" y1="97.2" x2="628.0" y2="92.0" stroke="var(--s1)" stroke-width="1.25" opacity="0.6"/><path d="M78.0 298.1L373.5 183.0L628.0 96.5" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="298.1" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="373.5" cy="183.0" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="96.5" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 298.1L628.0 106.8" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/><text x="637.0" y="100.3" class="lbl" fill="var(--s1)">measured</text><text x="637.0" y="113.8" class="lbl" fill="var(--fg3)">linear</text><line x1="78.0" y1="392.0" x2="94.0" y2="392.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="395.8" class="lg">measured</text><line x1="160.8" y1="392.0" x2="176.8" y2="392.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="182.8" y="395.8" class="lg">linear</text><text x="78" y="422.0" class="cap">Median of interleaved repetitions; band is the 95% bootstrap interval of the median. A shared</text><text x="78" y="436.0" class="cap">mmap-able index would be a flat line. Every read benchmark in the design document calls</text><text x="78" y="450.0" class="cap">Reader::open before starting its timer, so this cost appears nowhere.</text></svg>