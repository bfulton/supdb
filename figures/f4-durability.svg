<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Throughput is bought with the data a crash would destroy"><style>:root{--fg:#151a24;--fg2:#525d74;--fg3:#7d879c;--grid:#e2e6ee;--axis:#aeb6c6;--bg:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#4a3aa7;}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}}:root[data-theme="dark"]{--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}.ttl{font-size:15px;font-weight:600;fill:var(--fg)}.sub{font-size:11.5px;fill:var(--fg2)}.ax{font-size:11px;fill:var(--fg2);font-variant-numeric:tabular-nums}.axt{font-size:11.5px;font-weight:500;fill:var(--fg2)}.lbl{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.cap{font-size:10.5px;fill:var(--fg3)}.lg{font-size:11px;fill:var(--fg2)}</style><rect width="760" height="460" fill="var(--bg)"/><text x="78" y="26" class="ttl">Throughput is bought with the data a crash would destroy</text><text x="78" y="43" class="sub">checkpoint() rewrites the entire key index, not what changed</text><line x1="78" y1="352.0" x2="628.0" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="355.8" class="ax" text-anchor="end">0</text><line x1="78" y1="251.1" x2="628.0" y2="251.1" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="254.9" class="ax" text-anchor="end">500k</text><line x1="78" y1="150.3" x2="628.0" y2="150.3" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="154.1" class="ax" text-anchor="end">1M</text><line x1="78.0" y1="62" x2="78.0" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="78.0" y="370.0" class="ax" text-anchor="middle">1k</text><line x1="150.0" y1="62" x2="150.0" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="150.0" y="370.0" class="ax" text-anchor="middle">2k</text><line x1="245.1" y1="62" x2="245.1" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="245.1" y="370.0" class="ax" text-anchor="middle">5k</text><line x1="317.0" y1="62" x2="317.0" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="317.0" y="370.0" class="ax" text-anchor="middle">10k</text><line x1="389.0" y1="62" x2="389.0" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="389.0" y="370.0" class="ax" text-anchor="middle">20k</text><line x1="484.1" y1="62" x2="484.1" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="484.1" y="370.0" class="ax" text-anchor="middle">50k</text><line x1="556.0" y1="62" x2="556.0" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="556.0" y="370.0" class="ax" text-anchor="middle">100k</text><line x1="628.0" y1="62" x2="628.0" y2="352.0" stroke="var(--grid)" stroke-width="1"/><text x="628.0" y="370.0" class="ax" text-anchor="middle">200k</text><line x1="78" y1="352.0" x2="628.0" y2="352.0" stroke="var(--axis)" stroke-width="1"/><text x="353.0" y="392.0" class="axt" text-anchor="middle">operations at risk between checkpoints (log)</text><text transform="translate(18.0,207.0) rotate(-90)" class="axt" text-anchor="middle">appends/s</text><path d="M78.0 343.4L389.0 311.1L628.0 83.5L628.0 154.1L389.0 319.0L78.0 346.2Z" fill="var(--s1)" opacity="0.14"/><line x1="78.0" y1="346.2" x2="78.0" y2="343.4" stroke="var(--s1)" stroke-width="1.25" opacity="0.6"/><line x1="389.0" y1="319.0" x2="389.0" y2="311.1" stroke="var(--s1)" stroke-width="1.25" opacity="0.6"/><line x1="628.0" y1="154.1" x2="628.0" y2="83.5" stroke="var(--s1)" stroke-width="1.25" opacity="0.6"/><path d="M78.0 344.3L389.0 313.9L628.0 139.9" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="344.3" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="389.0" cy="313.9" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="139.9" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><text x="637.0" y="143.7" class="lbl" fill="var(--s1)">Supdb</text><text x="78" y="422.0" class="cap">The rightmost point takes no checkpoint before close, so the whole run is at risk -- the</text><text x="78" y="436.0" class="cap">configuration every published fillrandom number was measured in. A usable engine needs a point</text><text x="78" y="450.0" class="cap">on the left of this curve, which requires an incremental checkpoint.</text></svg>