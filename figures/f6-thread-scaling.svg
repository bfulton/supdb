 y="85.7" class="lbl" fill="var(--fg3)">linear</text><text x="637.0" y="279.5" class="lbl" fill="var(--s1)">measured</text><line x1="78.0" y1="392.0" x2="94.0" y2="392.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="395.8" class="lg">measured</text><line x1="160.8" y1="392.0" x2="176.8" y2="392.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="182.8" y="395.8" class="lg">linear</text><text x="78" y="422.0" class="cap">Median of interleaved repetitions; band is the 95% bootstrap interval. Every db_bench comparison</text><text x="78" y="436.0" class="cap">in the design document is single-threaded, which is the configuration in which this does not</text><text x="78" y="450.0" class="cap">appear.</text></svg>