)" stroke-width="2"/><circle cx="444.7" cy="242.1" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="536.3" cy="279.2" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="304.5" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 70.1L169.7 110.5L261.3 150.2L353.0 190.7L444.7 229.9L536.3 267.9L628.0 297.4" fill="none" stroke="var(--s4)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="70.1" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="169.7" cy="110.5" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="261.3" cy="150.2" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="353.0" cy="190.7" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="444.7" cy="229.9" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="536.3" cy="267.9" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="297.4" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 311.5L628.0 311.5" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/><text x="637.0" y="276.0" class="lbl" fill="var(--s4)">10M keys</text><text x="637.0" y="289.5" class="lbl" fill="var(--s3)">5M keys</text><text x="637.0" y="303.0" class="lbl" fill="var(--fg3)">steady state</text><text x="637.0" y="316.5" class="lbl" fill="var(--s2)">1M keys</text><text x="637.0" y="330.0" class="lbl" fill="var(--s1)">100k keys</text><line x1="78.0" y1="392.0" x2="94.0" y2="392.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="395.8" class="lg">100k keys</text><line x1="167.4" y1="392.0" x2="183.4" y2="392.0" stroke="var(--s2)" stroke-width="2"/><text x="189.4" y="395.8" class="lg">1M keys</text><line x1="243.6" y1="392.0" x2="259.6" y2="392.0" stroke="var(--s3)" stroke-width="2"/><text x="265.6" y="395.8" class="lg">5M keys</text><line x1="319.8" y1="392.0" x2="335.8" y2="392.0" stroke="var(--s4)" stroke-width="2"/><text x="341.8" y="395.8" class="lg">10M keys</text><line x1="402.6" y1="392.0" x2="418.6" y2="392.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="424.6" y="395.8" class="lg">steady state</text><text x="78" y="422.0" class="cap">Below the break-even point the open dominates and the published read throughput does not</text><text x="78" y="436.0" class="cap">describe the workload. Many short-lived reader processes was uppend's founding premise, and is</text><text x="78" y="450.0" class="cap">the regime this design is worst at.</text></svg>