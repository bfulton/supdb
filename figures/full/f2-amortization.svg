<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A short-lived reader process pays for the whole index"><style>:root{--fg:#151a24;--fg2:#525d74;--fg3:#7d879c;--grid:#e2e6ee;--axis:#aeb6c6;--bg:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#4a3aa7;}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}}:root[data-theme="dark"]{--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}.ttl{font-size:15px;font-weight:600;fill:var(--fg)}.sub{font-size:11.5px;fill:var(--fg2)}.ax{font-size:11px;fill:var(--fg2);font-variant-numeric:tabular-nums}.axt{font-size:11.5px;font-weight:500;fill:var(--fg2)}.lbl{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.cap{font-size:10.5px;fill:var(--fg3)}.lg{font-size:11px;fill:var(--fg2)}</style><rect width="760" height="460" fill="var(--bg)"/><text x="78" y="26" class="ttl">A short-lived reader process pays for the whole index</text><text x="78" y="43" class="sub">total wall time including process spawn and index build, divided by reads</text><line x1="78" y1="319.9" x2="628.0" y2="319.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="323.7" class="ax" text-anchor="end">1</text><line x1="78" y1="280.1" x2="628.0" y2="280.1" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="283.9" class="ax" text-anchor="end">10</text><line x1="78" y1="240.2" x2="628.0" y2="240.2" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="244.0" class="ax" text-anchor="end">100</text><line x1="78" y1="200.4" x2="628.0" y2="200.4" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="204.2" class="ax" text-anchor="end">1k</text><line x1="78" y1="160.6" x2="628.0" y2="160.6" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="164.4" class="ax" text-anchor="end">10k</text><line x1="78" y1="120.8" x2="628.0" y2="120.8" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="124.6" class="ax" text-anchor="end">100k</text><line x1="78" y1="80.9" x2="628.0" y2="80.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="84.7" class="ax" text-anchor="end">1M</text><line x1="78.0" y1="62" x2="78.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="78.0" y="348.0" class="ax" text-anchor="middle">1</text><line x1="169.7" y1="62" x2="169.7" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="169.7" y="348.0" class="ax" text-anchor="middle">10</text><line x1="261.3" y1="62" x2="261.3" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="261.3" y="348.0" class="ax" text-anchor="middle">100</text><line x1="353.0" y1="62" x2="353.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="353.0" y="348.0" class="ax" text-anchor="middle">1k</text><line x1="444.7" y1="62" x2="444.7" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="444.7" y="348.0" class="ax" text-anchor="middle">10k</text><line x1="536.3" y1="62" x2="536.3" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="536.3" y="348.0" class="ax" text-anchor="middle">100k</text><line x1="628.0" y1="62" x2="628.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="628.0" y="348.0" class="ax" text-anchor="middle">1M</text><line x1="78" y1="330.0" x2="628.0" y2="330.0" stroke="var(--axis)" stroke-width="1"/><text x="353.0" y="370.0" class="axt" text-anchor="middle">reads performed by the process (log)</text><text transform="translate(18.0,196.0) rotate(-90)" class="axt" text-anchor="middle">cost per read (us) (log)</text><path d="M78.0 153.8L169.7 191.3L261.3 235.0L353.0 273.2L444.7 306.2L536.3 319.5L628.0 321.9" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round