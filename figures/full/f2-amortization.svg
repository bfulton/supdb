und" stroke-linecap="round"/><circle cx="78.0" cy="73.8" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="169.7" cy="132.8" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="261.3" cy="175.5" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="353.0" cy="194.5" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="444.7" cy="208.1" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="536.3" cy="245.1" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="267.3" r="4" fill="var(--s4)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 282.0L628.0 282.0" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/><text x="637.0" y="271.1" class="lbl" fill="var(--s4)">10M keys</text><text x="637.0" y="284.6" class="lbl" fill="var(--s3)">5M keys</text><text x="637.0" y="298.1" class="lbl" fill="var(--fg3)">steady state</text><text x="637.0" y="311.6" class="lbl" fill="var(--s2)">1M keys</text><text x="637.0" y="325.1" class="lbl" fill="var(--s1)">100k keys</text><line x1="78.0" y1="392.0" x2="94.0" y2="392.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="395.8" class="lg">100k keys</text><line x1="167.4" y1="392.0" x2="183.4" y2="392.0" stroke="var(--s2)" stroke-width="2"/><text x="189.4" y="395.8" class="lg">1M keys</text><line x1="243.6" y1="392.0" x2="259.6" y2="392.0" stroke="var(--s3)" stroke-width="2"/><text x="265.6" y="395.8" class="lg">5M keys</text><line x1="319.8" y1="392.0" x2="335.8" y2="392.0" stroke="var(--s4)" stroke-width="2"/><text x="341.8" y="395.8" class="lg">10M keys</text><line x1="402.6" y1="392.0" x2="418.6" y2="392.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="424.6" y="395.8" class="lg">steady state</text><text x="78" y="422.0" class="cap">Below the break-even point the open dominates and the published read throughput does not</text><text x="78" y=