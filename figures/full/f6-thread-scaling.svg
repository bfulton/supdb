ll="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="188.0" cy="312.4" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="334.7" cy="310.0" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="314.8" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 314.5L114.7 299.0L188.0 268.0L334.7 205.9L628.0 81.9" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/><text x="637.0" y="85.7" class="lbl" fill="var(--fg3)">linear</text><text x="637.0" y="318.6" class="lbl" fill="var(--s1)">measured</text><line x1="78.0" y1="392.0" x2="94.0" y2="392.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="395.8" class="lg">measured</text><line x1="160.8" y1="392.0" x2="176.8" y2="392.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="182.8" y="395.8" class="lg">linear</text><text x="78" y="422.0" class="cap">Median of interleaved repetitions; band is the 95% bootstrap interval. Every db_bench comparison</text><text x="78" y="436.0" class="cap">in the design document is single-threaded, which is the configuration in which this does not</text><text x="78" y="450.0" class="cap">appear.</text></svg>