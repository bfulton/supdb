<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Write throughput does not scale with writer threads"><style>:root{--fg:#151a24;--fg2:#525d74;--fg3:#7d879c;--grid:#e2e6ee;--axis:#aeb6c6;--bg:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#4a3aa7;}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}}:root[data-theme="dark"]{--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}.ttl{font-size:15px;font-weight:600;fill:var(--fg)}.sub{font-size:11.5px;fill:var(--fg2)}.ax{font-size:11px;fill:var(--fg2);font-variant-numeric:tabular-nums}.axt{font-size:11.5px;font-weight:500;fill:var(--fg2)}.lbl{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.cap{font-size:10.5px;fill:var(--fg3)}.lg{font-size:11px;fill:var(--fg2)}</style><rect width="760" height="460" fill="var(--bg)"/><text x="78" y="26" class="ttl">Write throughput does not scale with writer threads</text><text x="78" y="43" class="sub">the appender mutex is taken inside seal_shard's per-extent loop</text><line x1="78" y1="330.0" x2="628.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="333.8" class="ax" text-anchor="end">0</text><line x1="78" y1="260.3" x2="628.0" y2="260.3" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="264.1" class="ax" text-anchor="end">5M</text><line x1="78" y1="190.5" x2="628.0" y2="190.5" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="194.3" class="ax" text-anchor="end">10M</text><line x1="78" y1="120.8" x2="628.0" y2="120.8" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="124.6" class="ax" text-anchor="end">15M</text