<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The index is resident, per process, and shared with nobody"><style>:root{--fg:#151a24;--fg2:#525d74;--fg3:#7d879c;--grid:#e2e6ee;--axis:#aeb6c6;--bg:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#4a3aa7;}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}}:root[data-theme="dark"]{--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}.ttl{font-size:15px;font-weight:600;fill:var(--fg)}.sub{font-size:11.5px;fill:var(--fg2)}.ax{font-size:11px;fill:var(--fg2);font-variant-numeric:tabular-nums}.axt{font-size:11.5px;font-weight:500;fill:var(--fg2)}.lbl{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.cap{font-size:10.5px;fill:var(--fg3)}.lg{font-size:11px;fill:var(--fg2)}</style><rect width="760" height="460" fill="var(--bg)"/><text x="78" y="26" class="ttl">The index is resident, per process, and shared with nobody</text><text x="78" y="43" class="sub">Reader::build allocates one Vec per key plus a 2N-slot hash table, before the first read</text><line x1="78" y1="307.6" x2="628.0" y2="307.6" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="311.4" class="ax" text-anchor="end">5</text><line x1="78" y1="277.1" x2="628.0" y2="277.1" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="280.9" class="ax" text-anchor="end">10</text><line x1="78" y1="246.5" x2="628.0" y2="246.5" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="250.3" class="ax" text-anchor="end">20</text><line x1="78" y1="206.2" x2="628.0" y2="206.2" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="210.0" class="ax" text-anchor="end">50</text><line x1="78" y1="175.6" x2="628.0" y2="175.6" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="179.4" class="ax" text-anchor="end">100</text><line x1="78" y1="145.1" x2="628.0" y2="145.1" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="148.9" class="ax" text-anchor="end">200</text><line x1="78" y1="104.7" x2="628.0" y2="104.7" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="108.5" class="ax" text-anchor="end">500</text><line x1="78" y1="74.2" x2="628.0" y2="74.2" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="78.0" class="ax" text-anchor="end">1k</text><line x1="78.0" y1="62" x2="78.0" y2="316.0" stroke="var(--grid)" stroke-width="1"/><text x="78.0" y="334.0" class="ax" text-anchor="middle">50k</text><line x1="215.5" y1="62" x2="215.5" y2="316.0" stroke="var(--grid)" stroke-width="1"/><text x="215.5" y="334.0" class="ax" text-anchor="middle">100k</text><line x1="353.0" y1="62" x2="353.0" y2="316.0" stroke="var(--grid)" stroke-width="1"/><text x="353.0" y="334.0" class="ax" text-anchor="middle">200k</text><line x1="534.8" y1="62" x2="534.8" y2="316.0" stroke="var(--grid)" stroke-width="1"/><text x="534.8" y="334.0" class="ax" text-anchor="middle">500k</text><line x1="78" y1="316.0" x2="628.0" y2="316.0" stroke="var(--axis)" stroke-width="1"/><text x="353.0" y="356.0" class="axt" text-anchor="middle">keys in the store (log)</text><text transform="translate(18.0,189.0) rotate(-90)" class="axt" text-anchor="middle">reader index memory (MB) (log)</text><path d="M78.0 295.3L353.0 235.2L628.0 174.3" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="295.3" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="353.0" cy="235.2" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="174.3" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 203.7L353.0 143.6L628.0 82.7" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="203.7" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="353.0" cy="143.6" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="82.7" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><text x="637.0" y="86.5" class="lbl" fill="var(--s2)">eight readers</text><text x="637.0" y="178.1" class="lbl" fill="var(--s1)">one reader</text><line x1="78.0" y1="378.0" x2="94.0" y2="378.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="381.8" class="lg">one reader</text><line x1="174.0" y1="378.0" x2="190.0" y2="378.0" stroke="var(--s2)" stroke-width="2"/><text x="196.0" y="381.8" class="lg">eight readers</text><line x1="289.8" y1="378.0" x2="305.8" y2="378.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="311.8" y="381.8" class="lg">machine RAM</text><text x="78" y="408.0" class="cap">An index read through a shared mapping would cost this once for the machine, not once per</text><text x="78" y="422.0" class="cap">process. In RUM terms (Athanassoulis et al., EDBT'16) this is the memory spent to buy read</text><text x="78" y="436.0" class="cap">performance -- a legitimate trade, but the term that decides how many reader processes fit, and</text><text x="78" y="450.0" class="cap">many reader processes is the premise.</text></svg>