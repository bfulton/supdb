<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A short-lived reader process pays for the whole index"><style>:root{--fg:#151a24;--fg2:#525d74;--fg3:#7d879c;--grid:#e2e6ee;--axis:#aeb6c6;--bg:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#4a3aa7;}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}}:root[data-theme="dark"]{--fg:#e3e8f2;--fg2:#9aa5bc;--fg3:#6e7a92;--grid:#242c3a;--axis:#3a4557;--bg:#0d1017;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;}.ttl{font-size:15px;font-weight:600;fill:var(--fg)}.sub{font-size:11.5px;fill:var(--fg2)}.ax{font-size:11px;fill:var(--fg2);font-variant-numeric:tabular-nums}.axt{font-size:11.5px;font-weight:500;fill:var(--fg2)}.lbl{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.cap{font-size:10.5px;fill:var(--fg3)}.lg{font-size:11px;fill:var(--fg2)}</style><rect width="760" height="460" fill="var(--bg)"/><text x="78" y="26" class="ttl">A short-lived reader process pays for the whole index</text><text x="78" y="43" class="sub">total wall time including process spawn and index build, divided by reads</text><line x1="78" y1="323.9" x2="628.0" y2="323.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="327.7" class="ax" text-anchor="end">1</text><line x1="78" y1="269.9" x2="628.0" y2="269.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="273.7" class="ax" text-anchor="end">10</text><line x1="78" y1="215.9" x2="628.0" y2="215.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="219.7" class="ax" text-anchor="end">100</text><line x1="78" y1="161.9" x2="628.0" y2="161.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="165.7" class="ax" text-anchor="end">1k</text><line x1="78" y1="107.9" x2="628.0" y2="107.9" stroke="var(--grid)" stroke-width="1"/><text x="69.0" y="111.7" class="ax" text-anchor="end">10k</text><line x1="78.0" y1="62" x2="78.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="78.0" y="348.0" class="ax" text-anchor="middle">1</text><line x1="215.5" y1="62" x2="215.5" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="215.5" y="348.0" class="ax" text-anchor="middle">10</text><line x1="353.0" y1="62" x2="353.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="353.0" y="348.0" class="ax" text-anchor="middle">100</text><line x1="490.5" y1="62" x2="490.5" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="490.5" y="348.0" class="ax" text-anchor="middle">1k</text><line x1="628.0" y1="62" x2="628.0" y2="330.0" stroke="var(--grid)" stroke-width="1"/><text x="628.0" y="348.0" class="ax" text-anchor="middle">10k</text><line x1="78" y1="330.0" x2="628.0" y2="330.0" stroke="var(--axis)" stroke-width="1"/><text x="353.0" y="370.0" class="axt" text-anchor="middle">reads performed by the process (log)</text><text transform="translate(18.0,196.0) rotate(-90)" class="axt" text-anchor="middle">cost per read (us) (log)</text><path d="M78.0 125.1L215.5 181.4L353.0 236.9L490.5 282.5L628.0 319.0" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="125.1" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="215.5" cy="181.4" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="353.0" cy="236.9" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="490.5" cy="282.5" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="319.0" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 103.9L215.5 158.1L353.0 212.0L490.5 263.6L628.0 305.0" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="103.9" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="215.5" cy="158.1" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="353.0" cy="212.0" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="490.5" cy="263.6" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="305.0" r="4" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 73.0L215.5 126.8L353.0 180.6L490.5 233.4L628.0 282.5" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="73.0" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="215.5" cy="126.8" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="353.0" cy="180.6" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="490.5" cy="233.4" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="628.0" cy="282.5" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><path d="M78.0 315.6L628.0 315.6" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/><text x="637.0" y="280.5" class="lbl" fill="var(--s3)">200k keys</text><text x="637.0" y="303.0" class="lbl" fill="var(--s2)">50k keys</text><text x="637.0" y="316.5" class="lbl" fill="var(--fg3)">steady state</text><text x="637.0" y="330.0" class="lbl" fill="var(--s1)">10k keys</text><line x1="78.0" y1="392.0" x2="94.0" y2="392.0" stroke="var(--s1)" stroke-width="2"/><text x="100.0" y="395.8" class="lg">10k keys</text><line x1="160.8" y1="392.0" x2="176.8" y2="392.0" stroke="var(--s2)" stroke-width="2"/><text x="182.8" y="395.8" class="lg">50k keys</text><line x1="243.6" y1="392.0" x2="259.6" y2="392.0" stroke="var(--s3)" stroke-width="2"/><text x="265.6" y="395.8" class="lg">200k keys</text><line x1="333.0" y1="392.0" x2="349.0" y2="392.0" stroke="var(--fg3)" stroke-width="2" stroke-dasharray="5 4"/><text x="355.0" y="395.8" class="lg">steady state</text><text x="78" y="422.0" class="cap">Below the break-even point the open dominates and the published read throughput does not</text><text x="78" y="436.0" class="cap">describe the workload. Many short-lived reader processes was uppend's founding premise, and is</text><text x="78" y="450.0" class="cap">the regime this design is worst at.</text></svg>