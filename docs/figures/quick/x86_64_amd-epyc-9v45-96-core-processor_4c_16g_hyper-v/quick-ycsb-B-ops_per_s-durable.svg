<text x="72" y="28" font-size="15" font-weight="600">At 3×10⁵ keys supdb is 2.2× ahead of LMDB and 2.6× ahead of RocksDB</text>
<text x="72" y="47" font-size="12">YCSB-B, read-mostly (95/5 read/update, zipfian), throughput, durable per batch, to 3×10⁵ keys</text>
<text x="72" y="64" font-size="11" fill="#6b6b6b">x86_64/amd-epyc-9v45-96-core-processor/4c/16g/hyper-v · dbc2a2a · 2026-11-25 · median with 95% CI over 5 reps</text>
