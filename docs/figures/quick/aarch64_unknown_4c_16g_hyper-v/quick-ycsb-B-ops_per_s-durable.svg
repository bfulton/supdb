<text x="72" y="28" font-size="15" font-weight="600">At 3×10⁵ keys supdb is 3.4× ahead of LMDB and 2.7× ahead of RocksDB</text>
<text x="72" y="47" font-size="12">YCSB-B, read-mostly (95/5 read/update, zipfian), throughput, durable per batch, to 3×10⁵ keys</text>
<text x="72" y="64" font-size="11" fill="#6b6b6b">aarch64/unknown/4c/16g/hyper-v · 09cadec · 2026-11-27 · median with 95% CI over 5 reps</text>
