<text x="72" y="28" font-size="15" font-weight="600">At 3×10⁵ keys supdb is 1.1× ahead of LMDB and 5.5× ahead of RocksDB</text>
<text x="72" y="47" font-size="12">Ordered scans on the store the mixes leave, aggregate throughput on 3 threads, durable per batch, to 3×10⁵ keys</text>
