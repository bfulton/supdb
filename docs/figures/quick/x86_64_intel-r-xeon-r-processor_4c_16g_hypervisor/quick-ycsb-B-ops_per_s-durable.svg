<text x="72" y="28" font-size="15" font-weight="600">At 3×10⁵ keys supdb is 2.9× ahead of LMDB and 2.4× ahead of RocksDB</text>
<text x="72" y="47" font-size="12">YCSB-B, read-mostly (95/5 read/update, zipfian), throughput, durable per batch, to 3×10⁵ keys</text>
