# The door (forms.md R1, gate test G-door), by symbol.
#
# Files, mappings, advice, syncs and process reads go through the door's
# modules: crate::db::vault, crate::bytes, crate::db::pager, crate::crypt,
# crate::db::dirkey and crate::db::blocks, each of which carries the lint's
# allow at its top. An allow anywhere else names its reason and is counted
# by tests/data/door.txt (tests/source.rs, the_door_holds_what_clippy_cannot).
#
# The libc entries are a class, held to the source: every libc function
# the door's builds declare (glibc, x86_64 and aarch64) that takes a string
# argument, the argument a path is passed in, is either here or in
# tests/data/door-libc.txt with the reason it acts on no file, and
# tests/source.rs reads the resolved libc's declarations to hold that
# (every_libc_call_that_takes_a_string_is_barred_or_said_to_touch_no_file).
# Beside them the libc calls that act on a descriptor's or a mapping's bytes
# with no string -- read and write, seek, map, advise, sync, splice, ioctl,
# syscall, bind and connect -- are a list, written by hand. So are the rest:
# std's calls that act by path (std::fs, std::os::unix::fs, Path's
# questions of the filesystem, a unix socket bound or connected by path,
# the working directory) or run a program (std::process::Command), and
# memmap2's mappings and every method of a mapping that advises, syncs,
# locks, remaps or changes its protection. A call outside those is not
# barred: an fd's own metadata (fchmod, fchown, futimens), dup, close, and
# the std::fs::File type, whose methods act on a handle the door gave
# (below). An entry that resolves to nothing, or to a thing of the wrong
# kind, bars nothing; the run fails on it (scripts/door/lint.sh,
# door_run), and tests/source.rs holds each table to its kind of path.
#
# Run by scripts/door/run.sh (the lint group of scripts/check.sh) over the
# library alone, on Linux, with its red input, scripts/door/red.sh. The
# config is here and not at the root so that tests, examples and bench,
# which read stored files by path on purpose, see none of it.
#
# Not barred here: the std::fs::File type and its methods (the door hands
# out File until S1's typed handles), and the thread calls (decision 11:
# S1, where the pin:: wrappers are; tests/source.rs counts std::thread:: per
# file meanwhile). Code the run's build compiles out is held by text
# against these same entries (tests/source.rs, `cfgout`).
disallowed-methods = [
  # std::fs by path
  { path = "std::fs::File::open", reason = "open through crate::db::vault" },
  { path = "std::fs::File::create", reason = "create through crate::db::vault" },
  { path = "std::fs::File::create_new", reason = "create through crate::db::vault" },
  { path = "std::fs::File::options", reason = "open through crate::db::vault" },
  { path = "std::fs::OpenOptions::new", reason = "open through crate::db::vault" },
  { path = "std::fs::OpenOptions::open", reason = "open through crate::db::vault" },
  "std::fs::read", "std::fs::read_to_string", "std::fs::write",
  "std::fs::read_dir", "std::fs::rename", "std::fs::remove_file",
  "std::fs::remove_dir", "std::fs::remove_dir_all", "std::fs::create_dir",
  "std::fs::create_dir_all", "std::fs::hard_link", "std::fs::copy",
  "std::fs::metadata", "std::fs::symlink_metadata", "std::fs::canonicalize",
  "std::fs::read_link", "std::fs::set_permissions", "std::fs::exists",
  "std::os::unix::fs::symlink", "std::os::unix::fs::chown",
