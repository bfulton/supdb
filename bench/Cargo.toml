# Its own workspace, deliberately: the engine's `cargo build` and `cargo test`
# stay engine-only and never pay for the comparators' C++ builds, and the
# engine's lockfile never lists them. The price is the profile repeated at
# the end of this file.
[workspace]

[package]
name = "supdb-bench"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[lib]
name = "supdb_bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
# The engine under test: the repository this directory is in.
supdb = { path = ".." }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
memmap2 = "0.9"
serde_json = "1"
# Comparators. Every arm is in-process Rust so the comparison carries no
# binding overhead.
heed = "0.20"
# Built without compression libraries: every arm stores values uncompressed
# and the adapter turns compression off explicitly. Not optional: RocksDB is
# a headline comparator, and a comparison that is off by default is one that
# does not get run. The build needs libclang for bindgen; on a host where
# clang-sys does not find one, `scripts/libclang.sh` names the directory
# holding it (libclang.so, or libclang.dylib on macOS).
rocksdb = { version = "0.23", default-features = false }

[dev-dependencies]
# The payload test checks that values compress to the compressibility asked
# for, which is what makes every arm store the same bytes. The features are
# the engine's own (its manifest asks for these and no others): cargo unifies
# a dependency's features across the whole build, so a dev-dependency that
# asked for the crate's defaults linked the engine to the safe decoder in
# every example and test binary -- not the codec the engine ships, and the
# decode is the largest fixed cost of a read from the z form. The cross-check
# is the feature below.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }

[features]
# `zsize` built with the crate's safe encoder and decoder, to be run beside
# the build without it: the pages come out byte for byte the same, and the
# decode is what moves. Off for everything the suite measures.
lz4-safe = ["lz4_flex/safe-encode", "lz4_flex/safe-decode"]

# Cargo takes profiles from the root of the workspace being built, which is
# this manifest, so the engine's own [profile.release] is ignored here and
# cargo says so on every build. Every setting that decides code generation
# is repeated -- opt-level 3, fat LTO, one codegen unit -- so what is
# measured is what a user gets. Debug info is the one that differs on
# purpose: the engine asks for all of it, this asks for line tables, which
# is what a profiler needs to name a frame. Neither changes a byte of code.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1

# What this workspace's tests run under, as the engine's do. `cargo test
# --release` ran with the arithmetic and the invariants unchecked on both
# sides of the repository; the engine moved off it after a prefetch span
# summed a rank and a scan's limit of `usize::MAX`, wrapped, and passed
# every check green. This side kept `--release` for a while longer for no
# reason anyone had written down, which is the whole shape of a check that
# is not running. The binaries a measurement uses stay on `release`: the
# checks cost time, and time is what they measure.
[profile.checked]
inherits = "release"
overflow-checks = true
debug-assertions = true
