name: ci

# Two things are gated here, and they answer different questions.
#
# The engine's own jobs -- build, test, lint, the wasm module, the ARM
# cross-build -- say whether the code is sound. The `bench` job says whether
# the claims made about the engine still match what it measurably does: it
# fetches the falsification suite from supdb-bench, substitutes this checkout
# for the engine that repository carries as a submodule, and runs `verify`,
# which fails in both directions. A known limitation that quietly gets fixed
# is as much a reason to stop as one that gets worse, because either the
# engine changed or the experiment stopped testing anything.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Three platforms, none of them here for speed -- these runners are
    # virtualised and their timings mean nothing.
    #
    # ARM is here for correctness: the reader table is hand-rolled lock-free
    # code, and x86's total store order gives correct-looking behaviour for
    # orderings that ARM's weaker model does not.
    #
    # macOS is here because the tree carries `cfg(target_os = "linux")`
    # guards -- the I/O priority path in `src/db.rs` -- whose other side
    # nothing else compiles, and because the mapped read path runs over a
    # second kernel's mmap. A path only one arm exercises is a path nothing
    # tests. macos-latest is arm64, and a public repository pays nothing
    # for it.
    #
    # It gates building, testing and linting, not measuring. A timing
    # benchmark cannot gate a pull request: two runs on instances of the
    # same nominal machine have moved untouched comparator arms by half.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `scripts/check.sh` is the single definition of what this project
      # checks, so a contributor running it locally runs exactly this.
      - name: Build, test and lint
        run: sh scripts/check.sh build test lint

  cross-arm:
    # Proves the ARM paths build and pass before any ARM hardware is involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user-static
      # The linker and the emulator belong to this job, not to the
      # repository: `.cargo/config.toml` set them for the aarch64 target,
      # which is also the *host* target on the native ARM runner, so that
      # leg tried to run its own tests through a qemu it does not have.
      - name: Build and test under emulation
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static -L /usr/aarch64-linux-gnu
        run: cargo test --release --target aarch64-unknown-linux-gnu --lib

  wasm:
    # The browser reader, built. Nothing else in this workflow compiles the
    # wasm module, and that gap hid a real break: on rustc 1.98 the bare
    # `extern` block for the host imports stopped linking ("undefined
    # symbol: supdb_host_read") and no CI run noticed, because no CI run had
    # ever built it. Running the module against real indexes in Chromium,
    # and holding its size to a budget, are experiments with recorded
    # expected states and belong to supdb-bench; this job is the link step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the reader and the floor
        run: sh scripts/check.sh wasm

  bench:
    # The falsification suite, from supdb-bench, run against this checkout.
    #
    # That repository carries the engine as a submodule and records, per
    # committed result, which engine SHA produced it. The recorded pointer is
    # provenance, not build wiring: this job does not initialise the
    # submodule, it puts this checkout at that path and builds the suite on
    # top of it. Which bench ref is paired with which engine is printed
    # first and written to the job summary, because a silently wrong pairing
    # -- a green run against the wrong claims -- is the failure this guards
    # against.
    #
    # The bench ref is `main` unless the repository variable
    # SUPDB_BENCH_BRANCH names another. An engine change that flips a claim
    # is green against a bench branch carrying the matching claims.json edit
    # and red against main's claims until that branch merges; the variable
    # is how the pair is reviewed together.
    #
    # Pull requests and tags, not pushes to main. A push to main would
    # re-resolve the same engine against whatever bench ref the variable
    # names at that moment and could only disagree with the PR run by
    # measuring a different pairing; it would tell nobody anything new. It
    # needs no secrets, so it runs on pull requests from forks.
    #
    # `ci` is the profile, and `ci` is never citable: it proves the
    # experiments still run and the findings still say what claims.json
    # says they say.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      BENCH_REPO: https://github.com/bfulton/supdb-bench
      BENCH_REF: ${{ vars.SUPDB_BENCH_BRANCH || 'main' }}
      BENCH_REF_SOURCE: ${{ vars.SUPDB_BENCH_BRANCH && 'repository variable SUPDB_BENCH_BRANCH' || 'default' }}
      # Where the suite writes, so the run's records can be uploaded.
      CHECK_RESULTS: results-ci
      CHECK_FIGURES: figures-ci
    steps:
      - name: Clone supdb-bench at the matched ref
        # Before the engine checkout, because the engine goes *inside* it.
        # No `--recurse-submodules`: the submodule's directory is left
        # empty for the next step to fill.
        run: git clone --depth 1 --branch "$BENCH_REF" "$BENCH_REPO" supdb-bench

      - name: Check out this engine where the bench expects its submodule
        uses: actions/checkout@v4
        with:
          path: supdb-bench/supdb

      - name: Which bench, against which engine
        working-directory: supdb-bench
        run: |
          set -eu
          bench_sha=$(git rev-parse HEAD)
          recorded=$(git ls-tree HEAD supdb | awk '{ print $3 }')
          engine_sha=$(git -C supdb rev-parse HEAD)
          {
            echo "### bench pairing"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| supdb-bench ref | \`$BENCH_REF\` ($BENCH_REF_SOURCE) |"
            echo "| supdb-bench SHA | \`$bench_sha\` |"
            echo "| engine under test | \`$engine_sha\` (this checkout) |"
            echo "| submodule pointer recorded in supdb-bench | \`$recorded\` (not built) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=bench pairing::supdb-bench $BENCH_REF @ $bench_sha against engine $engine_sha"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The browser experiments build the reader through `web/build.sh`
          # from inside the bench workspace.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: supdb-bench

      - name: Suites, then the claim gate against their fresh results
        working-directory: supdb-bench
        run: |
          set -eu
          if [ -f scripts/check.sh ]; then
            sh scripts/check.sh suites
          else
            # supdb-bench does not carry scripts/check.sh yet. Its `suites`
            # group is the intended entry point, and this branch is what
            # that group is, spelled out; delete it once the script exists
            # there. Every experiment runs at `ci` into one directory and
            # `verify` is pointed at that directory rather than at the
            # committed results, so the verdict is about this engine.
            cargo build --release --workspace
            ./target/release/internal all --profile ci --out "$CHECK_RESULTS"
            ./target/release/external kv   --profile ci --out "$CHECK_RESULTS"
            ./target/release/external ycsb --profile ci --keys 10000 --ops 10000 --out "$CHECK_RESULTS"
            ./target/release/correctness all --profile ci --out "$CHECK_RESULTS"
            ./target/release/browser budget --profile ci --out "$CHECK_RESULTS"
            ./target/release/browser ranges --profile ci --out "$CHECK_RESULTS"
            ./target/release/browser dict   --profile ci --out "$CHECK_RESULTS"
            ./target/release/browser waves  --profile ci --out "$CHECK_RESULTS"
            ./target/release/verify --profile ci --results "$CHECK_RESULTS"
          fi

      - name: Publish the run's results and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements
          if-no-files-found: ignore
          path: |
            supdb-bench/results-ci/
            supdb-bench/figures-ci/
