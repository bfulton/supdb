name: ci

# Two questions are answered here. The engine's jobs -- build, test, lint,
# the wasm module, the ARM cross-build -- say whether the code is sound. The
# `bench` group in the same matrix says whether the suite in bench/ still
# builds and passes its own tests against this engine, and the `quick` job
# measures: one quick-scale run of every arm, gated against the committed
# series in bench/runs/, with the figures drawn from the row it wrote.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      arms:
        description: 'Arms for the quick job, comma-separated (empty runs every arm)'
        required: false
        default: ''
      keys:
        description: 'Keys for the quick job: numbered (the default) or ids, random 64-bit ids'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Three platforms, none of them here for speed -- these runners are
    # virtualised and their timings mean nothing.
    #
    # ARM is here for correctness: the reader table is hand-rolled lock-free
    # code, and x86's total store order gives correct-looking behaviour for
    # orderings that ARM's weaker model does not.
    #
    # macOS is here because the tree carries `cfg(target_os = "linux")`
    # guards -- the I/O priority path in `src/db.rs` -- whose other side
    # nothing else compiles, and because the mapped read path runs over a
    # second kernel's mmap. A path only one arm exercises is a path nothing
    # tests. macos-latest is arm64, and a public repository pays nothing
    # for it.
    #
    # The Linux runners are named by their image and not as `ubuntu-latest`:
    # that label moved to Ubuntu 26.04 between two runs of one afternoon,
    # where `bench/scripts/libclang.sh` found no libclang after installing
    # it (it wanted a -dev package's name for one then, and looked in the
    # highest LLVM directory alone; it takes the image's own now) and
    # `qemu-user-static` is no longer a package, and three jobs
    # failed in their set-up on a tree that had not changed. The image is
    # this workflow's to choose, as the ARM leg's already was; moving to a
    # newer one is a change made here, with the scripts it needs.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    # Every job here has a limit, since one without runs to GitHub's six
    # hours: `cross-arm` sat that long in its `apt-get` once, and the run
    # stayed open until the limit cancelled it. Each is a few times its
    # job's longest run on a hosted runner: this one takes twenty-five to
    # thirty-five minutes, and fifty-five on a macOS runner three times
    # slower than usual at RocksDB's build.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      # The comparators' build runs bindgen, which loads libclang as
      # RocksDB's build script runs; the script names this host's, and
      # installs one only on a host that has none.
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the script fetches its
      # sources at the pinned commit and installs the libraries they link.
      # It does nothing off Linux x86-64, where there is no `faster` arm.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      # Each line is `workspace -> target`, and the target is a path inside
      # its workspace: `bench -> bench/target` named bench/bench/target,
      # which is no directory, so the step saved a cache at every run with
      # nothing of the suite's build in it and RocksDB was built from its
      # sources in every job. The key carries nothing of the host's
      # libclang, and needs nothing: it is loaded when RocksDB's build
      # script runs (`bindgen-runtime`, bench/Cargo.toml), so no cached
      # output names its directory. While the build script linked it, one
      # did, and a restored build whose directory had gone failed there.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench -> target
      # `scripts/check.sh` is the single definition of what this project
      # checks, so a contributor running it locally runs exactly this.
      - name: Build, test and lint the engine and the suite
        run: sh scripts/check.sh build test stride lint bench
      - name: The machine, as a row records it
        run: ./bench/target/release/bench machine | tee -a "$GITHUB_STEP_SUMMARY"

  quick:
    # One quick-scale measurement on a hosted runner. It gates the pull
    # request on the gate's terms -- worse than every one of the last ten
    # rows of this runner's class in bench/runs/ -- and until that class has
    # three rows it can only prove the runner, the gate and the renderer
    # work end to end. The row and the figures are published as artifacts;
    # committing a row is a person's decision.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the script fetches its
      # sources at the pinned commit and installs the libraries they link.
      # It does nothing off Linux x86-64, where there is no `faster` arm.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      # `workspace -> target`, the target a path inside its workspace: see
      # the `test` job. The key is shared.
      # Every job that builds the suite's release binary and nothing else
      # builds the same dependencies, and under the action's default, a key
      # by the job's name, each kept a copy of them: one round of the
      # workflows that run by hand saved that build four times, the
      # repository passed GitHub's ten gigabytes, and what GitHub evicted,
      # by last read, included two caches a pull request was using. Under
      # one key the first of those jobs to run saves the cache and the rest
      # restore it. A job that restores a key whole saves nothing, so a job
      # that builds anything beside the binary keeps a key of its own, as
      # `rocksdb-alloc` does, or what it alone builds would never be
      # cached. `bench/scripts/workflows.sh` holds both.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench -> target
          shared-key: bench
      - name: One quick-scale run of every arm
        env:
          ARMS: ${{ inputs.arms }}
          KEYS: ${{ inputs.keys }}
        run: sh scripts/check.sh quick
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quick-row
          if-no-files-found: ignore
          path: bench/runs-ci/

  cost:
    # What a store in the clear pays an operation, counted by function under
    # callgrind against the commit the change is made on (scripts/cost.sh),
    # after the count has been shown red on a known-red input and green on
    # the tree against itself (scripts/cost-red.sh). A job of its own
    # because it builds the suite's probes three times and runs them under
    # valgrind, most of an hour; instruction counts are the same on any
    # runner, so a hosted one serves.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the suite's build needs
      # its sources, which the script fetches at the pinned commit.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      - name: valgrind
        run: sh scripts/apt.sh valgrind
      # `workspace -> target`, the target a path inside its workspace: see
      # the `test` job. The key every job that builds the suite's binary
      # shares (see the `quick` job): the probes build on the binary's
      # dependencies, RocksDB's among them, which the key restores, and
      # what they build beside it is the job's own each run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench -> target
          shared-key: bench
      # The event's values, and nothing decided here: scripts/base.sh takes
      # the base from them, as it does on a contributor's clone.
      - name: The plain store's cost, by function
        env:
          SUPDB_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SUPDB_PUSH_BEFORE: ${{ github.event.before }}
        run: sh scripts/check.sh cost

  lists:
    # The lists that only go down (tests/data's, registered in
    # scripts/ratchet.py) against the commit the change is made on: a list
    # grown past what scripts/raises.txt declares fails. The tests in the
    # test job see one tree; this job sees the base as well, so it needs
    # the whole history.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The lists, against the base
        env:
          SUPDB_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SUPDB_PUSH_BEFORE: ${{ github.event.before }}
        run: sh scripts/check.sh lists

  cross-arm:
    # Proves the ARM paths build and pass before any ARM hardware is involved.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # The target's C library is named: the compiler's package only
      # recommends it, and scripts/apt.sh installs no recommended extras.
      - name: Cross toolchain
        run: sh scripts/apt.sh gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static
      # The linker, the emulator and `--cfg supdb_emulated` are the
      # group's (scripts/check.sh cross-arm), not the repository's:
      # `.cargo/config.toml` set the first two for the aarch64 target, which
      # is also the *host* target on the native ARM runner, so that leg
      # tried to run its own tests through a qemu it does not have.
      - name: Build and test under emulation
        run: sh scripts/check.sh cross-arm

  enc:
    # The encrypted comparators: LMDB's 1.0 line behind its page hook and
    # RocksDB on its encrypted Env, each under a cipher from OpenSSL, which
    # `supdb-cipher` is read against. A build of the suite of their own
    # (bench/Cargo.toml, feature `enc`), which nothing else in this workflow
    # compiles: the arms' tests, and every arm of the encrypted roster run
    # once.
    runs-on: ubuntu-24.04
    # Two builds of the comparators, the suite's and the encrypted one's,
    # from a cold cache: a test leg's RocksDB build twice over.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the suite's build needs
      # its sources, which the script fetches at the pinned commit.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      - name: OpenSSL's headers, for the comparators' ciphers
        run: sh scripts/apt.sh libssl-dev
      # The encrypted build's own target directory, under a key of its own:
      # nothing else builds it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench -> target-enc
      - name: The encrypted comparators, built, tested and run once
        run: sh scripts/check.sh enc

  fscrypt:
    # A store under a key (`Encryption::Kernel`) asks the kernel to encrypt
    # its directory, and the kernel does that on a filesystem made for it,
    # which the runner's own is not: this job makes one in a file, mounts
    # it, and runs the half of tests/dirkey.rs that reads what the device
    # holds. As the runner's user, which is who hands the kernel the key.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - name: A filesystem that can encrypt
        run: sudo sh scripts/fscrypt.sh up /mnt/supdb-fscrypt "$(id -u):$(id -g)" >> "$GITHUB_ENV"
      - name: A store under a key
        run: sh scripts/check.sh fscrypt

  wasm:
    # The browser reader, built. Nothing else in this workflow compiles the
    # wasm module, and that gap hid a real break: on rustc 1.98 the bare
    # `extern` block for the host imports stopped linking ("undefined
    # symbol: supdb_host_read") and no CI run noticed, because no CI run had
    # ever built it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - uses: Swatinem/rust-cache@v2
      # The group also runs web/crypt.test.mjs under the runner's own Node:
      # the browser's decrypter against the envelope the Rust tests hold the
      # writer to.
      - name: Build the reader and the floor, and test the decrypter
        run: sh scripts/check.sh wasm
