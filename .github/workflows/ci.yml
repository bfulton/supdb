name: ci

# The point of this workflow is not that the code compiles. It is that the
# claims the repository makes about the engine still match what the engine
# measurably does. `verify` fails in both directions: a known limitation that
# quietly gets fixed is as much a reason to stop as one that gets worse,
# because either the engine changed or the experiment stopped testing anything.

on:
  # Pull requests and main only. Every branch commit would run three benchmark
  # suites, and most branch commits are work in progress.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Both architectures. ARM is not here for speed -- these runners are
    # virtualised and their timings mean nothing -- but for correctness: the
    # reader table is hand-rolled lock-free code, and x86's total store order
    # gives correct-looking behaviour for orderings that ARM's weaker model
    # does not.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Unit tests
        run: cargo test --release --workspace
      - name: Clippy
        run: cargo clippy --release --workspace -- -D warnings
      # Not `cargo fmt --all`: the vendored engine modules are exempt, and
      # the script names which and why (scripts/fmt.sh).
      - name: Format
        run: sh scripts/fmt.sh --check

  cross-arm:
    # Proves the ARM paths build and pass before any ARM hardware is involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user-static
      - name: Build and test under emulation
        run: cargo test --release --target aarch64-unknown-linux-gnu --lib

  falsify:
    # The falsification suite and the claim gate. Runs at the `ci` profile,
    # which is deliberately too small to be evidence about performance -- it
    # exists to prove the experiments still run and the findings still say what
    # claims.json says they say.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace

      - name: Internal falsification suite
        run: ./target/release/internal all --profile ci --out results-ci

      - name: External comparison suite
        run: |
          ./target/release/external kv   --profile ci --out results-ci
          ./target/release/external ycsb --profile ci --keys 10000 --ops 10000 --out results-ci

      - name: Correctness suite
        run: ./target/release/correctness all --profile ci --out results-ci

      - name: Verify claims against the measurements
        run: ./target/release/verify --profile ci --results results-ci

      - name: Regenerate figures
        run: ./target/release/figures --profile ci --results results-ci --out figures-ci

      - name: Publish results and figures
        uses: actions/upload-artifact@v4
        with:
          name: measurements
          path: |
            results-ci/
            figures-ci/

  committed-results-are-current:
    # Guards against results/ drifting away from the code that produced it.
    # A committed result whose schema no longer parses, or whose findings no
    # longer match claims.json, is a stale proof.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Verify the committed results
        run: ./target/release/verify --profile ci
      - name: Figures regenerate cleanly from committed results
        run: |
          ./target/release/figures --profile ci --out /tmp/figcheck
          test -s /tmp/figcheck/index.html
