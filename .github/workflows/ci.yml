name: ci

# Two questions are answered here. The engine's jobs -- build, test, lint,
# the wasm module, the ARM cross-build -- say whether the code is sound. The
# `bench` group in the same matrix says whether the suite in bench/ still
# builds and passes its own tests against this engine, and the `quick` job
# measures: one quick-scale run of every arm, gated against the committed
# series in bench/runs/, with the figures drawn from the row it wrote.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      arms:
        description: 'Arms for the quick job, comma-separated (empty runs every arm)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Three platforms, none of them here for speed -- these runners are
    # virtualised and their timings mean nothing.
    #
    # ARM is here for correctness: the reader table is hand-rolled lock-free
    # code, and x86's total store order gives correct-looking behaviour for
    # orderings that ARM's weaker model does not.
    #
    # macOS is here because the tree carries `cfg(target_os = "linux")`
    # guards -- the I/O priority path in `src/db.rs` -- whose other side
    # nothing else compiles, and because the mapped read path runs over a
    # second kernel's mmap. A path only one arm exercises is a path nothing
    # tests. macos-latest is arm64, and a public repository pays nothing
    # for it.
    #
    # The Linux runners are named by their image and not as `ubuntu-latest`:
    # that label moved to Ubuntu 26.04 between two runs of one afternoon,
    # where `bench/scripts/libclang.sh` finds no libclang after installing
    # it and `qemu-user-static` is no longer a package, and three jobs
    # failed in their set-up on a tree that had not changed. The image is
    # this workflow's to choose, as the ARM leg's already was; moving to a
    # newer one is a change made here, with the scripts it needs.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The comparators' build runs bindgen, which needs libclang; the script
      # names it for this host and, on macOS, the rpath the build script
      # needs to load it.
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench -> bench/target
      # `scripts/check.sh` is the single definition of what this project
      # checks, so a contributor running it locally runs exactly this.
      - name: Build, test and lint the engine and the suite
        run: sh scripts/check.sh build test stride lint bench
      - name: The machine, as a row records it
        run: ./bench/target/release/bench machine | tee -a "$GITHUB_STEP_SUMMARY"

  quick:
    # One quick-scale measurement on a hosted runner. It gates the pull
    # request on the gate's terms -- worse than every one of the last ten
    # rows of this runner's class in bench/runs/ -- and until that class has
    # three rows it can only prove the runner, the gate and the renderer
    # work end to end. The row and the figures are published as artifacts;
    # committing a row is a person's decision.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench -> bench/target
      - name: One quick-scale run of every arm
        env:
          ARMS: ${{ inputs.arms }}
        run: sh scripts/check.sh quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-row
          if-no-files-found: ignore
          path: bench/runs-ci/

  cost:
    # What a store in the clear pays an operation, counted by function under
    # callgrind against the commit the change is made on (scripts/cost.sh),
    # after the count has been shown red on a known-red input and green on
    # the tree against itself (scripts/cost-red.sh). A job of its own
    # because it builds the suite's probes three times and runs them under
    # valgrind, most of an hour; instruction counts are the same on any
    # runner, so a hosted one serves.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      - name: valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench -> bench/target
      # The event's values, and nothing decided here: scripts/base.sh takes
      # the base from them, as it does on a contributor's clone.
      - name: The plain store's cost, by function
        env:
          SUPDB_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SUPDB_PUSH_BEFORE: ${{ github.event.before }}
        run: sh scripts/check.sh cost

  lists:
    # The lists that only go down (tests/data's, registered in
    # scripts/ratchet.py) against the commit the change is made on: a list
    # grown past what scripts/raises.txt declares fails. The tests in the
    # test job see one tree; this job sees the base as well, so it needs
    # the whole history.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The lists, against the base
        env:
          SUPDB_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SUPDB_PUSH_BEFORE: ${{ github.event.before }}
        run: sh scripts/check.sh lists

  cross-arm:
    # Proves the ARM paths build and pass before any ARM hardware is involved.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user-static
      # The linker, the emulator and `--cfg supdb_emulated` are the
      # group's (scripts/check.sh cross-arm), not the repository's:
      # `.cargo/config.toml` set the first two for the aarch64 target, which
      # is also the *host* target on the native ARM runner, so that leg
      # tried to run its own tests through a qemu it does not have.
      - name: Build and test under emulation
        run: sh scripts/check.sh cross-arm

  fscrypt:
    # A store under a key (`Encryption::Kernel`) asks the kernel to encrypt
    # its directory, and the kernel does that on a filesystem made for it,
    # which the runner's own is not: this job makes one in a file, mounts
    # it, and runs the half of tests/dirkey.rs that reads what the device
    # holds. As the runner's user, which is who hands the kernel the key.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: A filesystem that can encrypt
        run: sudo sh scripts/fscrypt.sh up /mnt/supdb-fscrypt "$(id -u):$(id -g)" >> "$GITHUB_ENV"
      - name: A store under a key
        run: sh scripts/check.sh fscrypt

  wasm:
    # The browser reader, built. Nothing else in this workflow compiles the
    # wasm module, and that gap hid a real break: on rustc 1.98 the bare
    # `extern` block for the host imports stopped linking ("undefined
    # symbol: supdb_host_read") and no CI run noticed, because no CI run had
    # ever built it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The group also runs web/crypt.test.mjs under the runner's own Node:
      # the browser's decrypter against the envelope the Rust tests hold the
      # writer to.
      - name: Build the reader and the floor, and test the decrypter
        run: sh scripts/check.sh wasm
