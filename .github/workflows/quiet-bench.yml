name: quiet-bench

# The competitor comparison, run somewhere that holds still.
#
# `ext-kv` repeats and interleaves its engines and gates every ordering on a
# Mann-Whitney U test, which settles drift *within* a run. It does nothing
# about drift *between* runs, and on the cloud VM that produced every number
# in `results/` there is a great deal of it: EXT.1 has read 0.866x, 0.891x,
# 0.892x, 1.010x, 1.154x, 1.043x and 1.331x across seven such runs with the
# code unchanged between several of them, and LMDB's own load figure has
# ranged from 508,205 to 1,034,797 over the same runs.
#
# So the point here is not a faster machine, it is a quieter one -- and
# whether it is quieter is itself a measurement. Dispatch this twice and
# compare the spread against that list. If a laptop somebody is using turns
# out to wander as much as a shared VM, that is worth knowing before any of
# these numbers get cited.
#
# Two engines rather than four, and kv rather than the whole suite, because
# localmost kills a job at 600 seconds. supdb against lmdb is what EXT.1,
# EXT.4 and EXT.5 are about.

on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'Engines to compare'
        default: 'supdb,lmdb'
      suite:
        description: 'kv or ycsb (ignored when `internal` is set)'
        default: 'kv'
      internal:
        description: 'An internal experiment (e.g. f25-arena) to run instead of the comparison'
        default: ''
      args:
        description: 'Extra args for the experiment, e.g. --keys 400000 to fit the 9-minute cap'
        default: ''
      pickup_timeout_minutes:
        description: 'Cancel the run if no self-hosted runner claims the bench within this many minutes'
        default: '10'

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: bfulton/localmost/.github/workflows/check.yaml@main

  pickup-watchdog:
    needs: [check]
    if: needs.check.outputs.runner == 'self-hosted'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wait for a self-hosted runner to claim the bench
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WINDOW: ${{ inputs.pickup_timeout_minutes || '10' }}
        run: |
          set -uo pipefail
          deadline=$(( WINDOW * 2 ))   # polls, at 30s each
          for i in $(seq 1 "$deadline"); do
            job=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name=="bench") | "\(.status)|\(.runner_name)"' \
              2>&1 || true)
            status="${job%%|*}"
            runner="${job##*|}"
            echo "poll $i: status='$status' runner='$runner'"
            case "$status" in
              queued|"")
                # Still waiting, or the API did not answer. Keep waiting.
                ;;
              *)
                # Anything else means a runner has it or has had it. This job
                # is about pickup, and pickup has happened.
                echo "bench picked up by ${runner:-?} after $(( i * 30 ))s"
                exit 0
                ;;
            esac
            sleep 30
          done
          echo "::error::bench was still queued after ${WINDOW}m and no runner took it."
          echo "::error::Check Settings > Actions > Runners: registrations expire, and a"
          echo "::error::stale one leaves the localmost app heartbeating with nothing listening."
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" >/dev/null || true
          exit 1
                ;;
              "")
                # The job has not been created yet, or the API hiccupped.
                echo "waiting: bench job not visible yet"
                ;;
              *)
                echo "waiting: bench is $status ($(( i * 30 ))s)"
                ;;
            esac
            sleep 30
          done
          echo "::error::No self-hosted runner claimed the bench within ${WINDOW}m."
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" >/dev/null || true
          exit 1

  bench:
    needs: [check]
    # No fallback to a hosted runner, for the same reason the sweep has none:
    # a shared virtualised runner returns a number that looks like a
    # measurement and is not, and this job exists precisely to escape one.
    if: needs.check.outputs.runner == 'self-hosted'
    runs-on: ${{ needs.check.outputs.runner }}
    timeout-minutes: 9
    concurrency:
      group: timing-benchmark
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # No `dtolnay/rust-toolchain` here, unlike the hosted jobs. That action
      # provisions a toolchain on an ephemeral runner; this runner is somebody's
      # Mac and already has one. Running it anyway made `rustup toolchain
      # install stable` reach for static.rust-lang.org through localmost's
      # sandbox proxy, which answered `tunnel error: unsuccessful`, and the job
      # died two seconds in having been claimed successfully. Use what is
      # installed, and say so plainly if nothing is.
      - name: Use the toolchain this machine already has
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            echo "::error::No cargo on this runner and this job will not install one:"
            echo "::error::the sandbox has no route to static.rust-lang.org. Install a"
            echo "::error::stable toolchain on the Mac itself, once."
            exit 1
          fi
          cargo --version
          rustc --version
      - uses: Swatinem/rust-cache@v2
        # Best effort: this reaches GitHub's cache service, and a runner whose
        # egress is proxied may not get there. A cold build is slower; a failed
        # cache step would cost the whole measurement.
        continue-on-error: true
        with:
          shared-key: apple-silicon-sweep
      - name: Build
        # Only the two binaries this job runs. `--workspace` also builds
        # internal, correctness, verify and indexlab's dependencies, and the
        # whole job -- build included -- has to finish inside localmost's
        # 600-second kill. Minutes spent compiling what this job never
        # executes are minutes the measurement does not get.
        env:
          WANT_INTERNAL: ${{ inputs.internal }}
        run: |
          set -euo pipefail
          # Offline: see the note in apple-silicon.yml. The sandbox proxy
          # answers cargo's crates.io fetch with a 403, and this machine's
          # cargo cache already has what a build of this lockfile needs.
          # See the note in apple-silicon.yml: offline first, then the git
          # index protocol, because localmost's allowlist has crates.io and
          # static.crates.io but not index.crates.io, which is the host cargo's
          # sparse index actually uses.
          # `internal` is built only when asked for: it is another binary to
          # compile inside the same 600-second kill, and the comparison runs
          # do not use it.
          build() {
            cargo build --release --locked "$@" -p supdb --bin indexlab || return 1
            if [ -n "${WANT_INTERNAL:-}" ]; then
              cargo build --release --locked "$@" -p supdb --bin internal
            else
              cargo build --release --locked "$@" -p supdb-external --bin external
            fi
          }
          if build --offline; then
            echo "built from the local cargo cache"
          elif CARGO_REGISTRIES_CRATES_IO_PROTOCOL=git build; then
            echo "built via the git index protocol"
          else
            echo "::error::Neither the local cache nor the git index protocol"
            echo "::error::could build this. Add index.crates.io to localmost's"
            echo "::error::DEFAULT_ALLOWED_HOSTS, or run 'cargo fetch --locked'"
            echo "::error::once in a supdb checkout on this Mac."
            exit 1
          fi

      - name: Record the machine and what else it was doing
        run: |
          ./target/release/indexlab machine | tee bench-env.txt
          echo "# loadavg before: $(sysctl -n vm.loadavg)" | tee -a bench-env.txt

      - name: Measure
        # An internal experiment measures Supdb against itself with both arms
        # interleaved, so unlike the comparison it answers a question about
        # *this* machine's memory system rather than about another engine --
        # which is the point of running it on a second architecture. Apple
        # Silicon is 128-byte lines and 16KiB pages against x86's 64 and 4KiB;
        # for anything cache-shaped that is a different machine, not a quieter
        # one, and a result here replicates nothing pinned to x86.
        env:
          INTERNAL: ${{ inputs.internal }}
          EXTRA: ${{ inputs.args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          if [ -n "$INTERNAL" ]; then
            ./target/release/internal "$INTERNAL" --profile full --out out $EXTRA \
              | tee -a bench-env.txt
          else
            ./target/release/external '${{ inputs.suite }}' \
              --profile full \
              --engines '${{ inputs.engines }}' \
              --out out $EXTRA \
              | tee -a bench-env.txt
          fi
          echo "# loadavg after: $(sysctl -n vm.loadavg)" | tee -a bench-env.txt

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-bench-${{ inputs.internal || inputs.suite }}
          path: |
            out/
            bench-env.txt

      - name: Summary
        run: |
          {
            echo '## ${{ inputs.internal || format('ext-{0}', inputs.suite) }}, Apple Silicon, full profile'
            echo
            echo 'Not evidence yet. `results/` is the source of truth, this'
            echo 'artifact is not in it, and one run on a quiet machine is'
            echo 'still one run. The question this is here to answer is how'
            echo 'far two of them differ.'
            echo
            echo '```'
            cat bench-env.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
