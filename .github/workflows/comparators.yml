name: comparators

# The suite's comparator cells held to the comparators' own tools, on one
# hosted runner in one job, by hand and weekly: db_bench built from the
# RocksDB tree the suite links (the source `librocksdb-sys` vendors, at the
# version Cargo.lock pins) with the tuned arm's options, and a C program
# against the LMDB `lmdb-master-sys` vendors; then the suite's own
# `rocksdb-tuned` and `lmdb` arms over the quick ladder, and the table of the
# suite's cell against the tool's. The rule is registered in docs/engine.md:
# the suite's cell is at least 0.7x the tool's on every quantity the tool
# measures, or the job fails naming the quantity. A failure is a finding
# about an arm's configuration, not about the engine. The flags live in
# bench/scripts/comparators.sh; the table is the step summary and the
# artifact.

on:
  push:
    branches: [claude/funny-faraday-1ipfti]
    paths: ['.github/workflows/comparators.yml']
    # second throwaway run: the script exits with its table's verdict
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # One image, named once: the key of the kept db_bench below carries it,
    # since the binary is that image's compiler's.
    strategy:
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the script fetches its
      # sources at the pinned commit and installs the libraries they link.
      # It does nothing off Linux x86-64, where there is no `faster` arm.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      # db_bench is five minutes of RocksDB's C++, a third of this job, and
      # a function of the tree the lockfile pins, the flags in
      # comparators.sh and this image's compiler: the script keeps the
      # binary in the directory this step carries from run to run, under a
      # key made of the three. GitHub removes a cache nothing has read for
      # seven days and this job's schedule is weekly, so a scheduled run
      # may find it gone and build.
      - uses: actions/cache@v4
        id: tools
        with:
          path: bench/comparators-tools
          key: comparators-tools-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('bench/Cargo.lock', 'bench/scripts/comparators.sh') }}
      # Only where db_bench is to be built: a kept one has gflags linked
      # into it and needs neither.
      - name: cmake and gflags, for db_bench
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y cmake libgflags-dev
      # `workspace -> target`, the target a path inside its workspace: see
      # the `test` job of ci.yml. The key is the one every job that builds
      # the suite's binary alone shares: see the `quick` job there.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench -> target
          shared-key: bench
      - name: The tools, the suite's two arms, and the table
        env:
          COMPARATORS_TOOLS: ${{ github.workspace }}/bench/comparators-tools
        run: sh bench/scripts/comparators.sh comparators-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparators
          if-no-files-found: ignore
          path: |
            bench/comparators-ci/quick/
            bench/comparators-ci/tools/*.txt
            bench/comparators-ci/comparators.md
