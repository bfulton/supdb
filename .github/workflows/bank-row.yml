name: bank-row

# One quick-scale row from each hosted runner, proposed as a pull request
# that adds the rows under bench/runs/quick/ with the figures redrawn. The
# merge is a person's decision: the row says what the machine did, and
# bench/CLAUDE.md says when such a row is history and when it is not. Runs
# on a push to main and by hand, never on a pull request -- one row a merge
# a class is enough, and more floods the series -- and never on a
# self-hosted runner. The hosted runners rotate between CPU models (three
# in three consecutive runs of `ubuntu-latest`), and the row's class is the
# model, so a class's band forms as its own rows accumulate.
#
# The pull request needs the repository to allow Actions to create pull
# requests (Settings, Actions, General); where it does not, the branch the
# job pushes still holds the rows, and a person opens the pull request from
# it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  row:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    # As `quick` in ci.yml, whose work this is: a job with no limit runs to
    # GitHub's six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the script fetches its
      # sources at the pinned commit and installs the libraries they link.
      # It does nothing off Linux x86-64, where there is no `faster` arm.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      # `workspace -> target`, the target a path inside its workspace: see
      # the `test` job of ci.yml. The key is the one every job that builds
      # the suite's binary alone shares: see the `quick` job there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bench -> target
          shared-key: bench
      # The run and the gate apart, and the gate's exit not the step's: a
      # verdict against the series is what the pull request carries, not a
      # reason to lose the row.
      - name: One quick-scale run of every arm, and the gate's verdict
        working-directory: bench
        run: |
          set -eu
          cargo build --release --bin bench
          rm -rf runs-ci
          ./target/release/bench run --scale quick --out runs-ci
          ./target/release/bench gate runs-ci/quick/*.json --runs runs > runs-ci/gate.txt 2>&1 || true
          cat runs-ci/gate.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: row-${{ matrix.runner }}
          path: bench/runs-ci/
          if-no-files-found: ignore

  propose:
    needs: row
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The rows and the figures, made with the workflow's read-only token:
    # this job builds and runs the suite, every crate's build script with
    # it, so it holds nothing that can write. What it made goes to `push`
    # as a patch.
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the script fetches its
      # sources at the pinned commit and installs the libraries they link.
      # It does nothing off Linux x86-64, where there is no `faster` arm.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      # `workspace -> target`, the target a path inside its workspace: see
      # the `test` job of ci.yml. The key is the one every job that builds
      # the suite's binary alone shares: see the `quick` job there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bench -> target
          shared-key: bench
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: row-*
          path: rows
      # Each row under bench/runs/quick/, its gate verdict into the body,
      # and the figures redrawn from the rows -- the check holds the drawn
      # set to the committed one, as every check run does.
      - name: Add the rows and redraw the figures
        id: rows
        run: |
          set -eu
          n=0
          : > body.md
          for d in rows/row-*; do
            [ -d "$d" ] || continue
            for f in "$d"/quick/*.json; do
              [ -f "$f" ] || continue
              cp "$f" bench/runs/quick/
              n=$((n + 1))
              class=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1]))["machine"]; print(m["cpu_model"], "--", m["cpus"], "cores")' "$f")
              runner=$(basename "$d" | sed 's/^row-//')
              printf '## %s\n\n`%s`: %s\n\n```\n' "$runner" "$(basename "$f")" "$class" >> body.md
              if [ -f "$d/gate.txt" ]; then cat "$d/gate.txt" >> body.md; else echo "(no gate output)" >> body.md; fi
              printf '```\n\n' >> body.md
            done
          done
          echo "rows=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "no row to propose"
            exit 0
          fi
          sh bench/scripts/figures.sh
          sh bench/scripts/figures.sh --check
          mkdir -p bank
          git add bench/runs/quick docs/figures
          git diff --cached --binary > bank/rows.patch
          cp body.md bank/body.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.rows.outputs.rows != '0'
        with:
          name: bank
          path: bank/
          if-no-files-found: error

  push:
    needs: propose
    if: needs.propose.outputs.rows != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The one job that writes, and it builds nothing: a checkout, the
    # patch, git and gh. Its checkout keeps the token for `git push`.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bank
          path: bank
      - name: Propose the rows as a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          branch="bank/quick-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # The patch was made by a job that ran the suite's build: it may
          # touch the rows and the figures and nothing else of the tree.
          git apply --index --include='bench/runs/quick/*' --include='docs/figures/*' bank/rows.patch
          other=$(git diff --cached --name-only | grep -v -E '^(bench/runs/quick/|docs/figures/)' || true)
          if [ -n "$other" ]; then
            echo "the patch touches more than the rows and the figures: $other" >&2
            exit 1
          fi
          git commit -q -F - <<MSG
          Bank the hosted quick rows from run $RUN_ID

          $(cat bank/body.md)
          MSG
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bank quick rows at $(git rev-parse --short "$SHA") from the hosted runners" \
            --body-file bank/body.md || echo "the pull request was not created; the rows are on branch $branch"
