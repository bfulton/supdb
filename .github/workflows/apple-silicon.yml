name: apple-silicon

# Does the suite's machine capture read the right numbers on macOS? That is
# a parsing question, not a timing one, so a hosted -- and therefore
# virtualised -- Apple Silicon runner answers it. It was silently wrong once:
# the detector read a /sys path that does not exist on macOS and defaulted to
# a 64-byte line on a machine whose lines are 128. `bench machine` exits
# non-zero here if the line size was defaulted rather than read.
#
# Timing on Apple Silicon is `quiet-bench`, on a self-hosted Mac.

on:
  pull_request:
    paths:
      - 'bench/src/machine.rs'
      - 'bench/src/env.rs'
      - '.github/workflows/apple-silicon.yml'
  workflow_dispatch:

permissions:
  contents: read

# As every workflow that builds the suite sets it. The cache's key hashes
# the environment's CARGO_* variables, so a job without this one has a key
# no other job's matches, whatever the key is named.
env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    runs-on: macos-latest
    # The job is RocksDB's build and a second of `bench machine`: eight
    # minutes, and three times that on a slow runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml names, the one the local gate runs
      # under; no workflow names a version or a channel of its own.
      - name: The pinned toolchain
        run: sh scripts/toolchain.sh
      - name: libclang, for bindgen
        run: sh bench/scripts/libclang.sh
      # FASTER is a comparator too, and not a crate: the script fetches its
      # sources at the pinned commit and installs the libraries they link.
      # It does nothing off Linux x86-64, where there is no `faster` arm.
      - name: FASTER, for the `faster` arm
        run: sh bench/scripts/faster.sh
      # `workspace -> target`, the target a path inside its workspace: see
      # the `test` job of ci.yml. The key is the one every job that builds
      # the suite's binary alone shares: see the `quick` job there.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench -> target
          shared-key: bench
      - name: Build
        working-directory: bench
        run: cargo build --release --bin bench
      - name: Detect
        working-directory: bench
        run: |
          set -eu
          ./target/release/bench machine | tee machine.json
          grep -q '"cache_line_detected": true' machine.json
          grep -q '"cache_line": 128' machine.json
