[package]
name = "supdb"
version = "0.1.0"
edition = "2021"
description = "A read-optimized embedded key-multivalue store"
license = "MIT"
repository = "https://github.com/bfulton/supdb"

# A wasm build gets the reader and nothing else. `cdylib` is what the browser
# loads; `rlib` is what the bins and tests link.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }

# Not merely unused on wasm -- unreachable there, by cfg rather than by hoping.
#
# `memmap2` *resolves* for wasm32-unknown-unknown: the errors a naive build
# gets are about `Advice`, not about `Mmap` being absent, so the type compiles
# and there are no files to map. Excluding the dependency turns "compiles, then
# has nothing to map" into "does not build", which is the failure wanted.
# `libc` goes with it: the I/O priority and advice calls that use it are
# native-only paths.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
memmap2 = "0.9"
libc = "0.2"

# The tests' and the example's cipher, and nothing a build of the crate
# links: `supdb::crypt` defines the envelope and takes the cipher from its
# caller, and this is a caller.
[dev-dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }

# `supdb_emulated` is set by the CI job that runs the unit tests under
# qemu-user (`.github/workflows/ci.yml`, cross-arm), which takes `madvise`
# advice as a no-op: the tests that read the kernel's answer to that advice
# are compiled out there and run on the native legs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(supdb_emulated)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

# What the tests run under: optimized, with the arithmetic and the
# invariants checked. `cargo test --release` ran with neither, and a
# prefetch span that summed a rank and a scan's limit of `usize::MAX`
# wrapped through the checks green and panicked in every debug build;
# unoptimized, the longest tests run seven times as long. The wasm module
# and the suite's binaries keep the release profile: the checks cost code
# size there and time in a measurement. Level 2 with no LTO, many codegen
# units and incremental builds: every test target builds from nothing in
# under a minute and a half and after a one-line engine change in under
# one, at under two gigabytes for four compiles at once, and the tests run
# within a fifth of their time at level 3 (CLAUDE.md, running the checks).
# Debug info is line tables, what a backtrace needs to name a line.
[profile.checked]
inherits = "release"
overflow-checks = true
debug-assertions = true
debug = 1
opt-level = 2
lto = false
codegen-units = 256
incremental = true
